# Standalone ephemeral Postgres for local API dev (`bun run dev`, outside
# Docker) and integration tests. Completely independent from the app/postgres
# services in docker-compose.yml: different stack name, container name and
# network, and tmpfs storage so every start is a fresh DB — it never shares
# data or a volume with the real dev/prod stack, and it never gets a host
# port on the production compose file (that one stays unreachable from
# outside app-network by design).
name: app-bookmarks-test

services:
  postgres-test:
    image: postgres:18.4-alpine3.24
    container_name: bookmarks-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      # Default DB for local `bun run dev`; bookmarks_test (for
      # bun test:integration) is created by the init script below.
      POSTGRES_DB: bookmarks
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    volumes:
      - ./docker/test-db-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookmarks"]
      interval: 5s
      timeout: 3s
      retries: 10
