services:
  postgres:
    image: postgres:18.4-alpine3.24
    container_name: docker-postgres
    restart: unless-stopped
    ports:
      # bound to localhost only — for psql/pgAdmin on this machine; the app
      # reaches postgres over the internal network
      - "127.0.0.1:5432:5432"
    volumes:
      # PG 18 image layout: volume is /var/lib/postgresql, PGDATA defaults to
      # /var/lib/postgresql/18/docker (version-scoped, pg_upgrade-friendly)
      - postgres-data:/var/lib/postgresql:rw
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-bookmarks}
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bookmarks}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: docker-pgadmin
    restart: unless-stopped
    profiles: [dev]
    volumes:
      - pgadmin-data:/var/lib/pgadmin:rw
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-CHANGE_ME}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: app-bookmarks:latest
    container_name: app-bookmarks
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/${POSTGRES_DB:-bookmarks}
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      MAX_FOLDER_DEPTH: ${MAX_FOLDER_DEPTH:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${APP_PORT:-80}:3000"
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres-data:
  pgadmin-data:

networks:
  app-network:
    driver: bridge
