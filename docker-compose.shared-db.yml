# Opt-in override: point the api at the shared Postgres instance in
# my_docker/postgres/src/v1 instead of this repo's own postgres service.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.shared-db.yml up api --no-deps
# --no-deps is required — otherwise Compose still starts this repo's own
# postgres from docker-compose.yml via depends_on.
#
# One-time setup: create this app's database on the shared instance first
# (see README "Shared Postgres mode").
services:
  api:
    environment:
      DATABASE_URL: postgresql://${SHARED_POSTGRES_USER:-postgres}:${SHARED_POSTGRES_PASSWORD:-admin123four}@${SHARED_POSTGRES_HOST:-postgres-shared}:5432/${SHARED_POSTGRES_DB:-bookmarks}
    networks:
      - shared-postgres-net

networks:
  shared-postgres-net:
    external: true
