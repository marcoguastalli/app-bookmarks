name: Publish Docker image

# Build and push the single app-bookmarks container image to GitHub Container Registry (GHCR).
# This branch ships one image (SPA + API) built from the repo-root Dockerfile.
on:
  push:
    branches: ['no-nginx']  # every branch push publishes :no-nginx + :sha-<commit>
    tags: ['v*']            # pushing a v1.2.3 tag publishes that version + :latest
  workflow_dispatch:        # allow manual runs from the Actions tab

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history for commit count

      - name: Compute version
        id: version
        if: github.ref_type == 'branch'
        run: |
          MAJOR_MINOR=$(cat VERSION)
          PATCH=$(git rev-list --count HEAD)
          VERSION="${MAJOR_MINOR}.${PATCH}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up QEMU   # enables cross-arch (arm64) builds on the amd64 runner
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          # -> ghcr.io/marcoguastalli/app-bookmarks
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref_type == 'branch' }}
            type=ref,event=branch,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64   # multi-arch: pulls on x86 and Apple Silicon
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app-bookmarks
          # ignore-error: cache export to the GHA backend is flaky ("error writing
          # layer blob: not_found") and runs after the image is already pushed —
          # don't let it fail the whole run
          cache-to: type=gha,mode=max,scope=app-bookmarks,ignore-error=true
