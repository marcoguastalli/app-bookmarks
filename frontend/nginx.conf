server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # SPA routing: fallback to index.html for unknown routes
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html itself (SPA shell)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache versioned static assets (Vite adds a content hash to filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to dotfiles and hidden directories
    location ~ /\. {
        return 404;
    }
}
